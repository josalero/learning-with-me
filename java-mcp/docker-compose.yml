# Default stack: gateway, sample REST backends, and Postgres for audit + SQL tools.
#   docker compose up --build -d --wait
#
# Optional MCP client (one-shot):
#   docker compose --profile client run --rm --no-deps mcp-client

name: mcp-integration-gateway

services:
  recruiting-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: example-recruiting-api
    image: mcp-gateway/example-recruiting-api:local
    ports:
      - "9080:9080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: "9080"
      RECRUITING_CHAOS_DELAY_MS: ${RECRUITING_CHAOS_DELAY_MS:-0}
      RECRUITING_CHAOS_FORCE_STATUS: ${RECRUITING_CHAOS_FORCE_STATUS:-0}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 40s
    networks:
      - mcp-net

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: gateway
    image: mcp-gateway/gateway:local
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${GATEWAY_SPRING_PROFILES_ACTIVE:-docker,local}
      SERVER_PORT: "8080"
      GATEWAY_CONNECTIONS_RECRUITING_API_BASE_URL: http://recruiting-api:9080
      GATEWAY_CONNECTIONS_PROTECTED_API_BASE_URL: http://protected-api:9081
      GATEWAY_CONNECTIONS_PROTECTED_API_TOKEN_URI: http://protected-api:9081/oauth/token
      GATEWAY_JWT_HMAC_SECRET: ${GATEWAY_JWT_HMAC_SECRET:-local-demo-hmac-secret-change-me-32bytes}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mcp_gateway
      SPRING_DATASOURCE_USERNAME: gateway
      SPRING_DATASOURCE_PASSWORD: gateway
    depends_on:
      recruiting-api:
        condition: service_healthy
      protected-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s
    networks:
      - mcp-net

  protected-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: example-protected-api
    image: mcp-gateway/example-protected-api:local
    ports:
      - "9081:9081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: "9081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9081/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 40s
    networks:
      - mcp-net

  # Optional: run the end-to-end governed tool checks.
  mcp-client:
    profiles: ["client"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: example-mcp-client
    image: mcp-gateway/example-mcp-client:local
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_AI_MCP_CLIENT_STREAMABLE_HTTP_CONNECTIONS_GATEWAY_URL: http://gateway:8080
      SPRING_AI_MCP_CLIENT_STREAMABLE_HTTP_CONNECTIONS_GATEWAY_ENDPOINT: /mcp
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - mcp-net

  # REST API that uses MCP tools for integration (Feign replacement pattern).
  #   docker compose --profile orchestrator up --build -d --wait orchestrator-api
  orchestrator-api:
    profiles: ["orchestrator"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: example-orchestrator-api
    image: mcp-gateway/example-orchestrator-api:local
    ports:
      - "9082:9082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: "9082"
      SPRING_AI_MCP_CLIENT_STREAMABLE_HTTP_CONNECTIONS_GATEWAY_URL: http://gateway:8080
      SPRING_AI_MCP_CLIENT_STREAMABLE_HTTP_CONNECTIONS_GATEWAY_ENDPOINT: /mcp
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9082/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s
    networks:
      - mcp-net

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mcp_gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
    ports:
      - "5432:5432"
    volumes:
      - mcp_gateway_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d mcp_gateway"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - mcp-net

networks:
  mcp-net:
    driver: bridge

volumes:
  mcp_gateway_pg:

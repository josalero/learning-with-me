server:
  port: 8091

spring:
  application:
    name: spring-ai-app
  threads:
    virtual:
      enabled: true
  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY:}
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      chat:
        options:
          model: ${OPENROUTER_CHAT_MODEL:openai/gpt-4o-mini}

research:
  engine: spring-ai
  framework: Spring AI
  framework-version: "2.0.0"
  chat-model: ${OPENROUTER_CHAT_MODEL:openai/gpt-4o-mini}
  research-model: ${OPENROUTER_RESEARCH_MODEL:openai/gpt-4o-mini:online}
  pass-threshold: 9
  max-revisions: 2
  default-depth: 3
  sse-timeout-ms: 600000
  max-tokens: ${OPENROUTER_MAX_TOKENS:4096}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# Dokploy: rama feat/apartamento-dokploy-ci, path apartamento/docker-compose.dokploy.yml, root apartamento/.
# Dominio (p. ej. cotiza.my-tech-profile.dev) → servicio app, puerto contenedor 8080 (HTTPS en el panel).
# Variables: env.dokploy.example
services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-natarundi}
    volumes:
      - natarundi_pg_data:/var/lib/postgresql
    restart: unless-stopped

  app:
    image: ${APP_IMAGE:-ghcr.io/josalero/learning-with-me/apartamento:feat-apartamento-dokploy-ci}
    pull_policy: always
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_SEED_DEMO: ${APP_SEED_DEMO:-0}
      APP_DEMO_EMAIL: ${APP_DEMO_EMAIL:-}
      APP_DEMO_PASSWORD: ${APP_DEMO_PASSWORD:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_OFFLINE_STUB: ${AI_OFFLINE_STUB:-0}
      DEFAULT_USD_CRC_RATE: ${DEFAULT_USD_CRC_RATE:-520}
      FX_PROVIDER: ${FX_PROVIDER:-bccr-proxy}
      FX_USE_FIELD: ${FX_USE_FIELD:-venta}
      FX_CACHE_TTL_MINUTES: ${FX_CACHE_TTL_MINUTES:-360}
      # BCCR_API_TOKEN solo si FX_PROVIDER=bccr-sdde (opcional; por defecto no hace falta)
      BCCR_API_TOKEN: ${BCCR_API_TOKEN:-}
      AI_ROUTING_MODE: ${AI_ROUTING_MODE:-BALANCED}
      OPENROUTER_MODEL_ECONOMY: ${OPENROUTER_MODEL_ECONOMY:-}
      OPENROUTER_MODEL_BALANCED: ${OPENROUTER_MODEL_BALANCED:-}
      OPENROUTER_MODEL_FRONTIER: ${OPENROUTER_MODEL_FRONTIER:-}
    expose:
      - '8080'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    depends_on:
      - db
    restart: unless-stopped

volumes:
  natarundi_pg_data:
id: dev-only
roles:
  - id: developer
    kind: DEVELOPER
    model: ${MODEL_STRONG}
    prompt: prompts/developer.md
    temperature: 0.0
policy:
  maxSpecRework: 1
  maxImplementationAttempts: 1
  maxReviewCycles: 1
  maxQaCycles: 1
  maxStakeholderCycles: 1
  qaPassThreshold: 80
  stakeholderMode: AGENT
  maxDeveloperToolCalls: 25
  maxReadOnlyToolCalls: 10

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: aigateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: aigateway
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aigateway -d aigateway"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  otel:
    image: grafana/otel-lgtm
    ports:
      - "4318:4318"
      - "3000:3000"
  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: stub
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      REDIS_HOST: redis
      GATEWAY_AUDIT_HMAC_KEY: ${GATEWAY_AUDIT_HMAC_KEY:-dev-only-change-me}
      DEMO_RECRUITER_API_KEY: ${DEMO_RECRUITER_API_KEY:-}
      DEMO_ATS_API_KEY: ${DEMO_ATS_API_KEY:-}
      DEMO_GLOBEX_API_KEY: ${DEMO_GLOBEX_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

# Natarundi (apartamento) — tests, GHCR image, Dokploy compose deploy.
#
# Secret: DOKPLOY_COMPOSE_DEPLOY_WEBHOOK_URL — …/api/deploy/compose/<token>
# CI: POST + payload GitHub (ref = rama del push). Debe coincidir con la rama del compose en Dokploy.
#
# Dokploy Environment must set APP_IMAGE=ghcr.io/josalero/learning-with-me/apartamento:latest
# (or a sha-* tag for pin/rollback). See apartamento/docs/deployment-dokploy.md.

name: apartamento · Dokploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - feat/apartamento-dokploy-ci
    paths:
      - 'apartamento/**'
      - '.github/workflows/apartamento-*.yml'

permissions:
  contents: read

concurrency:
  group: apartamento-dokploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apartamento
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apartamento/package-lock.json
      - name: Install dependencies (public npm registry)
        run: npm ci --registry=https://registry.npmjs.org/
      - run: npm test
      - run: npm run build

  publish-image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Set GHCR image coordinates
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/apartamento"
          branch="${GITHUB_REF_NAME}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          {
            echo 'TAGS<<EOF'
            echo "$image:sha-${GITHUB_SHA}"
            if [ "$branch" = main ] || [ "$branch" = master ]; then
              echo "$image:latest"
            else
              # Feature branches: branch tag (no overwrite of :latest)
              safe_branch=$(printf '%s' "$branch" | tr '/_' '-' | tr '[:upper:]' '[:lower:]')
              echo "$image:${safe_branch}"
            fi
            echo EOF
          } >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: apartamento
          file: apartamento/Dockerfile
          push: true
          tags: ${{ env.TAGS }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=natarundi-apartamento
          cache-from: type=gha,scope=apartamento
          cache-to: type=gha,mode=max,scope=apartamento

  deploy-dokploy:
    needs: publish-image
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy compose deploy
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_COMPOSE_DEPLOY_WEBHOOK_URL }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::Set repository secret DOKPLOY_COMPOSE_DEPLOY_WEBHOOK_URL (Dokploy compose deploy URL)."
            exit 1
          fi
          # Dokploy valida ref vs rama del compose; GET desde CI → "Branch Not Match".
          payload=$(jq -n \
            --arg ref "$GITHUB_REF" \
            --arg sha "$GITHUB_SHA" \
            --arg repo "$GITHUB_REPOSITORY" \
            '{ ref: $ref, head_commit: { id: $sha }, repository: { full_name: $repo } }')
          status=$(curl -sS --max-time 120 -o /tmp/dokploy-deploy.out -w "%{http_code}" \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -d "$payload" || true)
          echo "HTTP ${status}"
          cat /tmp/dokploy-deploy.out 2>/dev/null || true
          echo
          if grep -q 'Branch Not Match' /tmp/dokploy-deploy.out 2>/dev/null; then
            echo "::error::Branch Not Match — en Dokploy (compose → Provider) la rama debe ser exactamente: ${GITHUB_REF#refs/heads/}"
            exit 1
          fi
          case "${status}" in
            2??) echo "Dokploy compose deploy triggered @ ${GITHUB_SHA}" ;;
            *) echo "::error::Dokploy deploy failed (HTTP ${status}). Enable Auto Deploy on the compose."; exit 1 ;;
          esac
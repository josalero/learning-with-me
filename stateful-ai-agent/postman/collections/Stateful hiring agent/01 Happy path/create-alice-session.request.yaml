$kind: http-request
name: 'Create Alice session'
method: POST
url: '{{baseUrl}}/api/v1/sessions'
order: 2000
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {"provider": "{{provider}}"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test('session created', function () { pm.response.to.have.status(201); });
      pm.collectionVariables.set('aliceSessionId', body.id);

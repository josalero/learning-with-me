$kind: http-request
name: 'Candidate accepted'
method: POST
url: '{{baseUrl}}/api/v1/sessions/{{aliceSessionId}}/messages'
order: 17000
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {"text": "candidate accepted offer for {{applicationId}}"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test('waiting for a person', function () {
          pm.response.to.have.status(202);
          pm.expect(body.status).to.eql('AWAITING_APPROVAL');
      });
      pm.collectionVariables.set('approvalId', body.approval.id);
      pm.collectionVariables.set('toolCallKey', body.approval.calls[0].toolCallKey);

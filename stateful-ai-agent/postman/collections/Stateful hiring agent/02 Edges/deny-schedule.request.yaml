$kind: http-request
name: 'Deny schedule'
method: POST
url: '{{baseUrl}}/api/v1/sessions/{{aliceSessionId}}/approvals/{{approvalId}}/decision'
order: 3000
headers:
  - key: Idempotency-Key
    value: '{{$guid}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {"decisions": [{"toolCallKey": "{{toolCallKey}}", "decision": "DENY", "reason": "Not now"}]}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('denied', function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json().status).to.eql('DENIED');
          pm.expect(pm.response.json().answer).to.include('Not now');
      });

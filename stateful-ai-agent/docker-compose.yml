services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stateful}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-stateful_agent}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stateful} -d ${POSTGRES_DB:-stateful_agent}"]
      interval: 5s
      timeout: 5s
      retries: 20

  otel:
    image: grafana/otel-lgtm
    ports:
      - "4318:4318"
      - "3000:3000"

  agent:
    build: .
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-stateful}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-stateful_agent}
      AGENT_ALICE_PASSWORD: ${AGENT_ALICE_PASSWORD:?set AGENT_ALICE_PASSWORD}
      AGENT_BOB_PASSWORD: ${AGENT_BOB_PASSWORD:?set AGENT_BOB_PASSWORD}
      AGENT_CAROL_PASSWORD: ${AGENT_CAROL_PASSWORD:?set AGENT_CAROL_PASSWORD}
      AGENT_DAVE_PASSWORD: ${AGENT_DAVE_PASSWORD:?set AGENT_DAVE_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_CHAT_MODEL: ${OPENROUTER_CHAT_MODEL:-openai/gpt-4o-mini}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_CHAT_MODEL: ${DEEPSEEK_CHAT_MODEL:-deepseek-chat}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
    depends_on:
      postgres:
        condition: service_healthy
      otel:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
